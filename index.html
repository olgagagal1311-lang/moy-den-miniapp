<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Мой день</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg-1:#F7F3ED;
  --bg-2:#E9E3D7;
  --glass:rgba(255,255,255,.52);
  --edge:rgba(255,255,255,.85);
  --ink:#3B372F;
  --ink-soft:#8C8376;
  --sage:#8CA080;
  --sage-deep:#68795B;
  --sage-lt:#B6C6A8;
  --sage-pale:#DFE7D7;
  --ok:#7E9B6A;
  --half:#DEB05C;
  --none:#C08A6E;
  --rest:#C7C2B6;
  --road:#DCD2C2;
  --shadow:0 10px 28px rgba(90,86,58,.13);
  --shadow-lift:0 16px 34px rgba(90,86,58,.20);
  --r-lg:24px;
  --font-d:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --font-b:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--font-b);color:var(--ink);min-height:100vh;
  background:
    radial-gradient(120% 60% at 80% -10%, #FFFDFA 0%, rgba(255,253,250,0) 60%),
    radial-gradient(90% 45% at 8% 102%, rgba(160,182,144,.34) 0%, rgba(160,182,144,0) 70%),
    linear-gradient(168deg,var(--bg-1) 0%, var(--bg-2) 100%);
  background-attachment:fixed;-webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.55;
  background:
    radial-gradient(38% 26% at 12% 8%, rgba(104,121,91,.16), transparent 70%),
    radial-gradient(26% 18% at 32% 2%, rgba(104,121,91,.12), transparent 70%),
    radial-gradient(30% 22% at 4% 28%, rgba(104,121,91,.10), transparent 70%),
    radial-gradient(34% 20% at 96% 46%, rgba(104,121,91,.09), transparent 70%);
}
.wrap{position:relative;z-index:1;max-width:430px;margin:0 auto;padding:16px 16px 150px}

.sprite{position:absolute;width:0;height:0;overflow:hidden}
.decor{position:absolute;pointer-events:none;color:var(--sage);z-index:0}
.d-hero{top:-14px;right:-20px;width:88px;height:58px;opacity:.26;transform:scaleX(-1) rotate(-10deg)}
.d-med{bottom:8px;right:12px;width:52px;height:52px;opacity:.28}
.d-water{top:6px;right:56px;width:48px;height:34px;opacity:.18;transform:rotate(6deg)}
.d-dock{position:absolute;left:0;right:0;bottom:0;height:46px;opacity:.16;color:var(--sage-deep);pointer-events:none}
.leaf-mark{width:13px;height:13px;color:var(--sage);opacity:.75;margin-right:6px;vertical-align:-1px;flex:none}

.card{
  position:relative;overflow:hidden;background:var(--glass);border:1px solid var(--edge);
  border-radius:var(--r-lg);box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.9);
  backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);
  padding:16px;margin-bottom:12px;
}
.card > *{position:relative;z-index:1}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-title{font-family:var(--font-d);font-size:18px;letter-spacing:.2px;display:flex;align-items:center;white-space:nowrap}
.card-meta{font-size:12px;color:var(--ink-soft);letter-spacing:.3px;text-align:right}

/* ——— заставка: две панели ——— */
.hero{display:flex;gap:10px;align-items:stretch;margin-bottom:12px}
.hero .card{margin-bottom:0}
.hero-photo{width:46%;max-width:168px;flex:none;padding:6px;background:linear-gradient(160deg,rgba(255,255,255,.72),rgba(233,227,215,.6))}
.hero-photo img{width:100%;height:auto;display:block;border-radius:18px}
.hero-photo::after{content:"";position:absolute;inset:6px;border-radius:18px;pointer-events:none;background:linear-gradient(200deg,rgba(255,255,255,.34) 0%,rgba(255,255,255,0) 44%);z-index:2}
.hero-empty{width:100%;aspect-ratio:360/482;border-radius:18px;display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-size:32px;color:var(--sage-deep);background:linear-gradient(160deg,#FFFDFA,#DFE7D7)}
.motto{font-family:var(--font-d);font-size:12.5px;line-height:1.4;text-align:center;color:var(--sage-deep);padding:11px 8px 4px;letter-spacing:.2px}
.motto::before{content:"";display:block;width:26px;height:1px;margin:0 auto 8px;background:rgba(140,160,128,.55)}
.hero-info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;padding:16px 14px}
.hello{font-size:12.5px;color:var(--ink-soft);letter-spacing:.4px}
.name{font-family:var(--font-d);font-size:25px;line-height:1.12;margin:3px 0 6px;letter-spacing:.3px;overflow-wrap:anywhere}
.date{font-size:11.5px;color:var(--ink-soft);line-height:1.35}
.hero-score{margin-top:18px}
.hero-score b{font-family:var(--font-d);font-weight:400;font-size:30px;color:var(--sage-deep)}
.hero-score i{font-style:normal;font-size:10px;color:var(--ink-soft);letter-spacing:.6px;display:block;margin-top:1px}
.streak{display:inline-flex;align-items:center;gap:5px;margin-top:9px;font-size:11px;color:var(--sage-deep);background:rgba(223,231,215,.6);border:1px solid rgba(255,255,255,.9);padding:4px 10px;border-radius:100px}

/* ——— иконка у кнопки ——— */
.badge{
  width:44px;height:44px;border-radius:15px;flex:none;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,rgba(255,255,255,.92),rgba(223,231,215,.72));
  border:1px solid var(--edge);color:var(--sage-deep);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95), 0 5px 12px rgba(90,86,58,.12);
}
.badge svg{width:24px;height:24px}
.badge.sm{width:36px;height:36px;border-radius:12px}
.badge.sm svg{width:20px;height:20px}
.on .badge{background:linear-gradient(160deg,rgba(214,228,202,.95),rgba(182,198,168,.8))}

/* ——— вода ——— */
.glasses{display:flex;gap:7px}
.glass-cup{flex:1;height:60px;border-radius:12px 12px 14px 14px;position:relative;overflow:hidden;border:1px solid var(--edge);background:rgba(255,255,255,.42);box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 4px 10px rgba(90,86,58,.08);cursor:pointer;transition:transform .18s ease}
.glass-cup:active{transform:scale(.95)}
.glass-cup .fill{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(180deg,rgba(182,198,168,.62),rgba(140,160,128,.48));transition:height .45s cubic-bezier(.3,.9,.3,1)}
.glass-cup .fill::before{content:"";position:absolute;top:-3px;left:0;right:0;height:6px;border-radius:50%;background:rgba(255,255,255,.55)}
.glass-cup .shine{position:absolute;top:6px;left:7px;width:6px;height:32px;border-radius:6px;background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,0))}
.water-row{display:flex;align-items:center;gap:12px;margin-top:12px}
.water-val{font-family:var(--font-d);font-size:20px}
.water-val small{font-size:12px;color:var(--ink-soft);font-family:var(--font-b)}

/* ——— 3D-кнопки ——— */
.knob{
  width:46px;height:46px;border-radius:50%;border:none;flex:none;cursor:pointer;
  background:radial-gradient(70% 60% at 32% 24%, rgba(255,255,255,.95), rgba(255,255,255,.25) 55%, rgba(255,255,255,0) 75%),linear-gradient(160deg,#FFFDFA,#E4E4D4);
  box-shadow:0 8px 16px rgba(90,86,58,.20), inset 0 -3px 6px rgba(126,138,110,.24), inset 0 2px 3px rgba(255,255,255,.95);
  color:var(--sage-deep);font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;
  transition:transform .12s ease, box-shadow .12s ease;
}
.knob:active{transform:translateY(2px);box-shadow:0 3px 8px rgba(90,86,58,.18), inset 0 -1px 4px rgba(126,138,110,.26)}
.knob.small{width:38px;height:38px;font-size:17px}

.toggle{width:100%;display:flex;align-items:center;gap:11px;cursor:pointer;background:none;border:none;padding:8px 0;font-family:var(--font-b);text-align:left;color:var(--ink)}
.pill{width:48px;height:28px;border-radius:100px;flex:none;position:relative;background:linear-gradient(160deg,rgba(255,255,255,.85),rgba(228,226,212,.75));border:1px solid var(--edge);box-shadow:inset 0 2px 5px rgba(126,138,110,.22), inset 0 -1px 0 rgba(255,255,255,.9);transition:background .3s ease}
.pill::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:radial-gradient(65% 55% at 34% 26%, rgba(255,255,255,.98), rgba(255,255,255,.3) 60%, transparent 74%),linear-gradient(160deg,#FFFDFA,#EDEDE0);box-shadow:0 3px 7px rgba(90,86,58,.28), inset 0 -2px 3px rgba(126,138,110,.2);transition:transform .3s cubic-bezier(.34,1.4,.5,1)}
.on .pill{background:linear-gradient(160deg,rgba(182,198,168,.95),rgba(140,160,128,.88))}
.on .pill::after{transform:translateX(20px)}
.t-txt{min-width:0;flex:1}
.t-label{font-size:15px;letter-spacing:.1px;overflow-wrap:anywhere}
.t-note{font-size:11.5px;color:var(--ink-soft);margin-top:2px}
.on .t-label{color:var(--sage-deep)}

.vibro{display:flex;align-items:center;gap:10px;margin-top:10px;padding-top:12px;border-top:1px solid rgba(255,255,255,.7)}
.pips{display:flex;gap:6px;margin-left:auto}
.pip{width:14px;height:14px;border-radius:50%;background:linear-gradient(160deg,rgba(255,255,255,.9),rgba(226,226,212,.8));box-shadow:inset 0 1px 2px rgba(126,138,110,.26), inset 0 -1px 0 rgba(255,255,255,.9)}
.pip.on{background:radial-gradient(60% 50% at 34% 26%, rgba(255,255,255,.9), transparent 70%),linear-gradient(160deg,var(--sage-lt),var(--sage))}


.med.glow{background:linear-gradient(160deg,rgba(255,255,255,.64),rgba(223,231,215,.58));box-shadow:var(--shadow-lift), inset 0 1px 0 rgba(255,255,255,.95), 0 0 0 1px rgba(140,160,128,.4)}
.moon{font-size:15px;opacity:.75}

/* ——— маршрут месяца ——— */
.row{
  display:flex;align-items:center;gap:11px;cursor:pointer;
  background:rgba(255,255,255,.34);border:1px solid rgba(255,255,255,.7);
  border-radius:18px;padding:9px 12px 9px 10px;margin-bottom:8px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8), 0 4px 12px rgba(90,86,58,.07);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:background .2s ease;
}
.row:active{background:rgba(255,255,255,.55)}
.row-t{flex:1;min-width:0}
.row-l{font-size:14.5px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-s{font-size:11px;color:var(--ink-soft);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.done .row-l{color:var(--sage-deep)}
.row.done .badge{background:linear-gradient(160deg,rgba(214,228,202,.95),rgba(182,198,168,.8))}
.chk{
  width:28px;height:28px;border-radius:50%;flex:none;border:none;padding:0;cursor:pointer;position:relative;
  background:linear-gradient(160deg,rgba(255,255,255,.9),rgba(228,226,212,.8));
  box-shadow:inset 0 2px 4px rgba(126,138,110,.22), inset 0 -1px 0 rgba(255,255,255,.9);
}
.chk.static{cursor:default}
.chk.on{background:radial-gradient(60% 50% at 34% 26%, rgba(255,255,255,.85), transparent 70%),linear-gradient(160deg,var(--sage-lt),var(--sage));box-shadow:0 3px 8px rgba(96,112,84,.25), inset 0 1px 0 rgba(255,255,255,.6)}
.chk.on::after{content:"";position:absolute;left:9px;top:7.5px;width:6px;height:10px;border:2px solid #FFFDF8;border-top:0;border-left:0;transform:rotate(42deg)}
.card.active{box-shadow:var(--shadow-lift), inset 0 1px 0 rgba(255,255,255,.95);border-color:rgba(255,255,255,.95);background:rgba(255,255,255,.6)}
.fold{background:none;border:none;color:var(--ink-soft);font-size:16px;line-height:1;padding:0 0 0 8px;cursor:pointer;vertical-align:-1px}
.sec{display:flex;align-items:center;gap:9px;margin:18px 4px 10px;font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--ink-soft)}
.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(140,160,128,.4),rgba(140,160,128,0))}
.sec.now{color:var(--sage-deep);font-weight:600}
.sec svg{width:12px;height:12px;color:var(--sage);opacity:.8;flex:none}
.rest-btn{
  width:100%;display:flex;align-items:center;justify-content:center;gap:9px;cursor:pointer;
  border:1px solid var(--edge);border-radius:100px;padding:13px;margin-top:2px;
  background:rgba(255,255,255,.5);font-family:var(--font-b);font-size:13.5px;color:var(--ink-soft);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9);
}
.rest-btn svg{width:16px;height:16px;flex:none}
.rest-btn.on{background:linear-gradient(160deg,rgba(240,238,232,.9),rgba(199,194,182,.6));color:var(--ink);border-color:rgba(255,255,255,.95)}
.close-day{display:none;margin:9px auto 0;background:none;border:none;font-family:var(--font-b);font-size:12px;color:var(--ink-soft);cursor:pointer;padding:4px 10px;border-bottom:1px solid rgba(140,131,118,.35)}
.rest-note{text-align:center;font-size:12px;color:var(--ink-soft);padding:6px 0 2px}
.route{width:100%;height:auto;display:block;margin-top:2px}
.legend{display:flex;gap:14px;justify-content:center;margin-top:12px;font-size:11px;color:var(--ink-soft)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.lg{width:10px;height:10px;border-radius:50%;display:inline-block}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:16px 16px calc(18px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(238,234,224,0),rgba(235,232,220,.94) 40%)}
.dock-in{position:relative;max-width:398px;margin:0 auto}
.main-btn{
  position:relative;z-index:1;display:block;width:100%;height:60px;border:none;border-radius:100px;cursor:pointer;overflow:hidden;
  font-family:var(--font-b);font-size:16.5px;font-weight:600;letter-spacing:.2px;color:#FBFDF7;
  background:radial-gradient(90% 120% at 22% 8%, rgba(255,255,255,.55), rgba(255,255,255,0) 46%),radial-gradient(70% 90% at 78% 92%, rgba(255,255,255,.26), rgba(255,255,255,0) 50%),linear-gradient(150deg,#A8BC98 0%, #8CA080 46%, #6B7D5E 100%);
  box-shadow:0 14px 26px rgba(96,112,84,.32), inset 0 -4px 10px rgba(78,92,66,.42), inset 0 2px 3px rgba(255,255,255,.55);
  transition:transform .13s ease, box-shadow .13s ease;text-shadow:0 1px 2px rgba(78,92,66,.32);
}
.main-btn::after{content:"";position:absolute;top:0;left:0;right:0;height:48%;background:linear-gradient(180deg,rgba(255,255,255,.30),rgba(255,255,255,0));border-radius:100px 100px 60% 60%;pointer-events:none}
.main-btn:active{transform:translateY(3px);box-shadow:0 5px 12px rgba(96,112,84,.28), inset 0 -2px 6px rgba(78,92,66,.38)}
.main-btn.done{background:radial-gradient(90% 120% at 22% 8%, rgba(255,255,255,.55), rgba(255,255,255,0) 46%),linear-gradient(150deg,#DCCBB4 0%, #C6B195 50%, #A5937A 100%);box-shadow:0 14px 26px rgba(120,102,80,.26), inset 0 -4px 10px rgba(112,94,72,.36), inset 0 2px 3px rgba(255,255,255,.7);color:#4A4238;text-shadow:0 1px 1px rgba(255,255,255,.45)}

.sheet{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(58,54,40,.28);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.sheet.open{display:flex;animation:fade .3s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet-box{position:relative;overflow:hidden;width:100%;max-width:340px;text-align:center;padding:30px 24px 24px;border-radius:28px;border:1px solid var(--edge);background:linear-gradient(160deg,rgba(255,255,255,.92),rgba(240,244,234,.85));box-shadow:0 24px 60px rgba(70,64,44,.3), inset 0 1px 0 rgba(255,255,255,.95);animation:rise .35s cubic-bezier(.2,.9,.3,1)}
@keyframes rise{from{transform:translateY(18px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.sheet-box > *{position:relative;z-index:1}
.sheet-box h3{font-family:var(--font-d);font-weight:400;font-size:23px;margin:0 0 10px}
.sheet-box p{font-size:14.5px;line-height:1.55;color:var(--ink-soft);margin:0 0 20px}
.sheet-box .big{font-family:var(--font-d);font-size:44px;color:var(--sage-deep);margin:2px 0 4px}
.d-sheet{top:-10px;right:-14px;width:120px;height:80px;opacity:.28;transform:rotate(14deg)}
.ghost{border:1px solid var(--edge);background:rgba(255,255,255,.72);border-radius:100px;padding:12px 26px;font-family:var(--font-b);font-size:14.5px;color:var(--ink);cursor:pointer;box-shadow:0 6px 14px rgba(90,86,58,.14), inset 0 1px 0 rgba(255,255,255,.9)}

.notice{font-size:11.5px;color:var(--ink-soft);text-align:center;padding:10px 14px;margin-bottom:12px;background:rgba(255,255,255,.45);border:1px solid var(--edge);border-radius:14px;line-height:1.45}
.hint{text-align:center;font-size:11px;color:var(--ink-soft);margin-top:14px;opacity:.8}

button:focus-visible,.glass-cup:focus-visible{outline:2px solid var(--sage-deep);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:359px){.hero-photo{width:44%}.name{font-size:22px}.hero-score b{font-size:26px}}
</style>
</head>

  vibroDone:2, streak:4,
  eveningLines:["День закрыт. Тело сказало спасибо.","Не идеально — и этого достаточно.","Ты выбрала себя сегодня.","Маленькие шаги каждый день собираются в другую жизнь."]
};

var D=null, S=null, MONTH={}, STREAK=0, offline=false, saveTimer=null;

/* ——— память: Telegram CloudStorage ——— */
var Store={
  ok:false, mem:{},
  init:function(){
    this.ok = !!(TG && TG.CloudStorage && TG.isVersionAtLeast && TG.isVersionAtLeast('6.9'));
  },
  get:function(keys,cb){
    if(!this.ok){ var o={},i; for(i=0;i<keys.length;i++) o[keys[i]]=this.mem[keys[i]]||null; return cb(o); }
    try{ TG.CloudStorage.getItems(keys,function(err,res){ cb(err?{}:(res||{})); }); }
    catch(e){ cb({}); }
  },
  set:function(k,v){
    if(!this.ok){ this.mem[k]=v; return; }
    try{ TG.CloudStorage.setItem(k,v,function(){}); }catch(e){}
  }
};
function parseJSON(t){ try{ return t?JSON.parse(t):null; }catch(e){ return null; } }
function pad(n){ return n<10?'0'+n:''+n; }
function dayKey(dt){ return dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate()); }
function monthKey(dt){ return 'm-'+dt.getFullYear()+'-'+pad(dt.getMonth()+1); }
function isoWeek(dt){
  var d=new Date(Date.UTC(dt.getFullYear(),dt.getMonth(),dt.getDate()));
  var n=d.getUTCDay()||7; d.setUTCDate(d.getUTCDate()+4-n);
  var y0=new Date(Date.UTC(d.getUTCFullYear(),0,1));
  return d.getUTCFullYear()+'-W'+Math.ceil(((d-y0)/86400000+1)/7);
}

function freshDay(){
  var max=Math.round(D.goals.waterMl/D.goals.glassMl);
  return {glasses:0,maxGlasses:max,supp:{},workout:false,vibro:0,book:false,med:false,rest:false,open:{}};
}
function restoreDay(st){
  S.glasses=st.glasses||0; S.workout=!!st.workout; S.vibro=st.vibro||0;
  S.book=!!st.book; S.med=!!st.med; S.rest=!!st.rest; S.open={};
  D.supplements.forEach(function(x){ S.supp[x.id]=!!(st.supp&&st.supp[x.id]); });
  STREAK=st.streak||0;
}
/* новый день: закрываем вчерашний, отмечаем пропуски, считаем серию */
function rollover(st,now){
  STREAK=st.streak||0;
  var prev=new Date(st.date+'T12:00:00'), score=st.score||0, curMk=monthKey(now);
  if(monthKey(prev)===curMk){ MONTH[String(prev.getDate())]=score; }
  else {
    var pmk=monthKey(prev);
    Store.get([pmk],function(r){
      var m=parseJSON(r[pmk])||{}; m[String(prev.getDate())]=score; Store.set(pmk,JSON.stringify(m));
    });
  }
  var d=new Date(prev.getTime()+86400000), missed=false, guard=0;
  while(dayKey(d)!==dayKey(now) && guard++<400){
    if(monthKey(d)===curMk) MONTH[String(d.getDate())]=0;
    missed=true;
    d=new Date(d.getTime()+86400000);
  }
  var goal=D.goals.dayGoal||4;
  if(score==='rest') STREAK=missed?0:STREAK;
  else STREAK=(!missed && score>=goal) ? STREAK+1 : 0;
  if(st.week===isoWeek(now)) S.vibro=st.vibro||0;
}
function save(){
  var now=new Date(), score=S.rest?'rest':doneCount();
  MONTH[String(now.getDate())]=score;
  Store.set('st',JSON.stringify({
    date:dayKey(now), week:isoWeek(now), glasses:S.glasses, supp:S.supp, workout:S.workout,
    vibro:S.vibro, book:S.book, med:S.med, rest:S.rest, streak:STREAK, score:score
  }));
  Store.set(monthKey(now),JSON.stringify(MONTH));
}
function saveSoon(){ clearTimeout(saveTimer); saveTimer=setTimeout(save,450); }

function boot(data,isOffline){
  D=data; offline=!!isOffline;
  if(!D.user) D.user={};
  if(!D.user.photo) D.user.photo=PHOTO;
  if(!D.month) D.month={};
  S=freshDay();
  D.supplements.forEach(function(x){ S.supp[x.id]=false; });
  STREAK=D.streak||0; S.vibro=D.vibroDone||0;
  Store.init();
  var now=new Date(), mk=monthKey(now);
  Store.get(['st',mk],function(res){
    var saved=parseJSON(res[mk]);
    if(saved){ MONTH=saved; }
    else { MONTH={}; for(var k in D.month) MONTH[k]=D.month[k]; }
    var st=parseJSON(res['st']);
    if(st && st.date===dayKey(now)) restoreDay(st);
    else if(st) rollover(st,now);
    render(); save();
  });
  /* если приложение осталось открытым через полночь */
  setInterval(function(){
    if(!D) return;
    var t=new Date();
    if(dayKey(t)!==CURRENT_DAY){ location.reload(); }
  },60000);
}
var CURRENT_DAY=dayKey(new Date());

fetch('data.json?v='+Date.now(),{cache:'no-store'})
  .then(function(r){ if(!r.ok) throw 0; return r.json(); })
  .then(function(j){ boot(j,false); })
  .catch(function(){ boot(FALLBACK,true); });

function doneCount(){
  var n=0;
  if(S.glasses>=S.maxGlasses) n++;
  D.supplements.forEach(function(s){ if(S.supp[s.id]) n++; });
  if(S.workout) n++;
  if(S.book) n++;
  if(S.med) n++;
  return n;
}
function totalTasks(){ return 4+D.supplements.length; }
function workoutToday(){ var d=new Date().getDay(); return D.workouts[String(d)]||D.workouts["default"]; }
var MONTHS_R=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
var MONTHS_N=["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"];
function ruDate(){
  var w=["воскресенье","понедельник","вторник","среда","четверг","пятница","суббота"], t=new Date();
  return t.getDate()+" "+MONTHS_R[t.getMonth()]+"<br>"+w[t.getDay()];
}
function streakWord(n){
  var a=n%10, b=n%100, w=(a===1&&b!==11)?'день':((a>=2&&a<=4&&(b<10||b>20))?'дня':'дней');
  return n+' '+w+' подряд';
}
function sec(title,idx,part){
  return '<div class="sec'+(idx===part?' now':'')+'"><svg aria-hidden="true"><use href="#i-leaf"/></svg>'+title+'</div>';
}
function greeting(){ var h=new Date().getHours(); return h<12?"Доброе утро":(h<18?"Добрый день":"Добрый вечер"); }
function ico(id,cls){ return '<div class="badge'+(cls?' '+cls:'')+'"><svg aria-hidden="true"><use href="#'+id+'"/></svg></div>'; }
function leafMark(){ return '<svg class="leaf-mark" aria-hidden="true"><use href="#i-leaf"/></svg>'; }
function decor(cls,id){ return '<svg class="decor '+cls+'" aria-hidden="true"><use href="#'+id+'"/></svg>'; }

/* ——— маршрут месяца ——— */
function routeSvg(){
  var t=new Date(), dim=new Date(t.getFullYear(),t.getMonth()+1,0).getDate(), today=t.getDate();
  var cols=6, rows=Math.ceil(dim/cols), W=360, cw=W/cols, ch=52, H=rows*ch+14;
  var pts=[];
  for(var i=0;i<dim;i++){
    var r=Math.floor(i/cols), c=i%cols;
    if(r%2===1) c=cols-1-c;
    pts.push({x:cw/2+c*cw, y:22+r*ch, day:i+1});
  }
  var line=pts.map(function(p){return p.x+','+p.y;}).join(' ');
  var s='<svg class="route" viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">';
  s+='<polyline points="'+line+'" fill="none" stroke="var(--road)" stroke-width="17" stroke-linejoin="round" stroke-linecap="round" opacity=".9"/>';
  s+='<polyline points="'+line+'" fill="none" stroke="#FFFDF8" stroke-width="1.6" stroke-dasharray="5 7" stroke-linejoin="round" opacity=".85"/>';
  pts.forEach(function(p){
    var v = p.day===today ? doneCount() : MONTH[String(p.day)];
    var fill, tx;
    if(p.day>today || v===undefined){ fill='#FFFDF8'; tx='#A8A093'; }
    else if(v==='rest'){ fill='var(--rest)'; tx='#FFFDF8'; }
    else if(v>=totalTasks()){ fill='var(--ok)'; tx='#FFFDF8'; }
    else if(v>0){ fill='var(--half)'; tx='#4A4238'; }
    else { fill='var(--none)'; tx='#FFFDF8'; }
    s+='<circle cx="'+p.x+'" cy="'+p.y+'" r="13" fill="'+fill+'" stroke="rgba(255,255,255,.9)" stroke-width="2"/>';
    if(p.day===today) s+='<circle cx="'+p.x+'" cy="'+p.y+'" r="17.5" fill="none" stroke="var(--sage-deep)" stroke-width="1.6" opacity=".8"/>';
    s+='<text x="'+p.x+'" y="'+(p.y+4)+'" text-anchor="middle" font-size="11.5" font-family="-apple-system,Segoe UI,Roboto,sans-serif" fill="'+tx+'">'+p.day+'</text>';
  });
  s+='</svg>';
  return s;
}

/* свёрнутая строка */
function row(key,icon,title,sub,done,act){
  var chk = act
    ? '<button class="chk'+(done?' on':'')+'" data-act="'+act+'" aria-label="отметить"></button>'
    : '<div class="chk static'+(done?' on':'')+'"></div>';
  return '<div class="row'+(done?' done':'')+'" data-act="open" data-val="'+key+'">'+
         ico(icon,'sm')+'<div class="row-t"><div class="row-l">'+title+'</div>'+
         (sub?'<div class="row-s">'+sub+'</div>':'')+'</div>'+chk+'</div>';
}
/* шапка раскрытой карточки со стрелкой «свернуть» */
function cardTop(title,meta,key,part){
  var manual = SLOT[key]!==part;
  return '<div class="card-top"><div class="card-title">'+leafMark()+title+'</div>'+
         '<div class="card-meta">'+meta+
         (manual?' <button class="fold" data-act="open" data-val="'+key+'" aria-label="свернуть">×</button>':'')+
         '</div></div>';
}
var SLOT={water:0,supp:0,workout:1,book:2,med:2};
function isOpen(key,part){ return SLOT[key]===part || !!(S.open&&S.open[key]); }

function undone(){
  var list=[];
  if(S.glasses<S.maxGlasses) list.push({act:'water+',label:'+ стакан воды',slot:0});
  D.supplements.forEach(function(x){ if(!S.supp[x.id]) list.push({act:'supp',val:x.id,label:'Отметить: '+x.title,slot:0}); });
  if(!S.workout) list.push({act:'workout',label:'Отметить тренировку',slot:1});
  if(!S.book) list.push({act:'book',label:'Отметить книгу',slot:2});
  if(!S.med) list.push({act:'med',label:'Отметить медитацию',slot:2});
  return list;
}
function nextAction(){
  if(S.rest) return {act:'finish',label:'Завершить день'};
  var u=undone();
  if(!u.length) return {act:'finish',label:'Завершить день'};
  var hh=new Date().getHours(), slot=hh<12?0:(hh<19?1:2), i, pick=null;
  for(i=0;i<u.length;i++) if(u[i].slot===slot){ pick=u[i]; break; }        // дела текущей части дня
  if(!pick) for(i=0;i<u.length;i++) if(u[i].slot<slot){ pick=u[i]; break; } // потом долги с утра
  return pick||u[0];
}
function paintMainBtn(){
  var n=nextAction(), b=document.getElementById('mainBtn'), c=document.getElementById('closeDay');
  b.textContent=n.label;
  b.className='main-btn'+(n.act==='finish'?' done':'');
  b.dataset.act=n.act;
  b.dataset.val=n.val||'';
  var hh=new Date().getHours();
  c.style.display=(hh>=19 && n.act!=='finish') ? 'block' : 'none';
}
function doAct(act,val){
  if(act==='supp'&&val) { S.supp[val]=!S.supp[val]; buzz('light'); saveSoon(); render(); return; }
  if(act==='water+') S.glasses=Math.min(S.maxGlasses,S.glasses+1);
  else if(act==='water-') S.glasses=Math.max(0,S.glasses-1);
  else if(act==='cup') S.glasses=(S.glasses===val+1)?val:val+1;
  else if(act==='workout') S.workout=!S.workout;
  else if(act==='vibro') S.vibro=S.vibro>=D.goals.vibroPerWeek?0:S.vibro+1;
  else if(act==='book') S.book=!S.book;
  else if(act==='med') S.med=!S.med;
  else if(act==='rest'){ S.rest=!S.rest; }
  else if(act==='open'){ if(!S.open) S.open={}; S.open[val]=!S.open[val]; buzz('light'); render(); return; }
  else if(act==='suppAll'){
    var all=D.supplements.every(function(x){ return S.supp[x.id]; });
    D.supplements.forEach(function(x){ S.supp[x.id]=!all; });
  }
  else if(act==='supp') S.supp[val]=!S.supp[val];
  else if(act==='finish'){ finish(); return; }
  buzz('light'); saveSoon(); render();
}
function finish(){
  var n=doneCount(), goal=D.goals.dayGoal||4, lines=D.eveningLines||FALLBACK.eveningLines;
  var txt=S.rest?'День отдыха. Серия не прервалась — это тоже часть заботы о себе.'
        :(n>=goal?lines[Math.floor(Math.random()*lines.length)]:'Сегодня меньше, чем хотелось. Это не провал — завтра новый круг.');
  document.getElementById('sheetTitle').textContent=S.rest?'День отдыха':'День закрыт';
  document.getElementById('sheetBig').textContent=S.rest?'—':(n+' / '+totalTasks());
  save();
  document.getElementById('sheetText').textContent=txt+((!S.rest&&n>=goal)?' Серия продолжается — завтра будет '+(STREAK+1)+'.':'');
  document.getElementById('sheet').classList.add('open');
  buzz('medium');
}
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act],[data-supp],[data-cup]');
  if(!t) return;
  if(t.dataset.cup!==undefined) doAct('cup',parseInt(t.dataset.cup,10));
  else if(t.dataset.supp) doAct('supp',t.dataset.supp);
  else doAct(t.dataset.act, t.dataset.val||undefined);
});
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter'&&e.key!==' ') return;
  var t=e.target.closest('[data-cup]');
  if(t){ e.preventDefault(); doAct('cup',parseInt(t.dataset.cup,10)); }
});
document.getElementById('closeDay').addEventListener('click',function(){ finish(); });
document.getElementById('sheetClose').addEventListener('click',function(){
  document.getElementById('sheet').classList.remove('open');
});
</script>
</body>
